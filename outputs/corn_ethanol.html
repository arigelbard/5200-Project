    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F5F0E8; --border: #E8E0D0; --text: #2a2520; --muted: #7a7060;
    }
    html, body { width: 100%; background: var(--bg); font-family: 'Georgia', serif; color: var(--text); }
    .chart-container { width: 100%; padding: 16px 12px 10px; background: var(--bg); }
    .chart-title { font-size: 0.95rem; font-weight: bold; text-align: center; margin-bottom: 3px; }
    .chart-subtitle { font-size: 0.7rem; color: var(--muted); text-align: center; margin-bottom: 14px; font-style: italic; }
    .charts-row { display: flex; gap: 10px; width: 100%; align-items: flex-start; }
    .line-chart-wrap { flex: 2.8; min-width: 0; }
    .bar-chart-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
    .bar-title { font-size: 0.68rem; color: var(--muted); text-align: center; margin-bottom: 4px; font-style: italic; min-height: 14px; }
    svg text { font-family: 'Georgia', serif; }
    .axis line, .axis path { stroke: var(--border); }
    .axis text { fill: var(--muted); font-size: 10px; font-family: 'Georgia', serif; }
    .grid line { stroke: var(--border); stroke-opacity: 0.8; }
    .grid path { stroke-width: 0; }
    .hover-line { stroke: #2C4A2E; stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }
    .hover-dot { fill: #2C4A2E; pointer-events: none; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; justify-content: center; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.67rem; color: var(--muted); }
    .legend-line { width: 18px; height: 2px; border-radius: 1px; }
    .legend-line.thick { height: 3px; }
    .legend-box { width: 9px; height: 9px; border-radius: 2px; }
  </style>
</head>

function drawLineChart() {
  const wrap = document.querySelector('.line-chart-wrap');

    .call(g => g.select('.domain').remove());

  g.append('text').attr('transform','rotate(-90)').attr('y',-34).attr('x',-h/2)
    .attr('text-anchor','middle').attr('fill','var(--muted)').attr('font-size','9px')
    .text('Price Index (2005 = 100)');

  g.append('line').attr('x1',0).attr('x2',w).attr('y1',ySc(100)).attr('y2',ySc(100))
    .attr('stroke','#aaa').attr('stroke-dasharray','3 3').attr('stroke-width',0.5);

  // Drought shading
  const d1 = xSc('2012_Q2'), d2 = xSc('2012_Q4');
  if (d1 && d2) {
    const step = xSc.step();
    g.append('rect').attr('x', d1-step/4).attr('y',0)
      .attr('width', d2-d1+step/2).attr('height',h)
      .attr('fill','#8B4513').attr('opacity',0.07);
  }

  // Annotations

    if (!x) return;

      .attr('writing-mode','vertical-rl').attr('font-family','Georgia,serif')
      .text(ann.label);
  });

  // Lines
  lineKeys.forEach(key => {
    const valid = priceData.filter(d => d[key] != null);
    const line = d3.line().x(d => xSc(d.yq)).y(d => ySc(d[key]));
    g.append('path').datum(valid).attr('fill','none')
      .attr('stroke', lineColors[key]).attr('stroke-width', lineWidths[key])
      .attr('d', line);
  });

  // Hover elements
  const hLine = g.append('line').attr('class','hover-line').attr('y1',0).attr('y2',h);
  const hDot  = g.append('circle').attr('class','hover-dot').attr('r',4);

  function updateSelected(q) {
    selectedQ = q;
    const x = xSc(q);
    if (!x) return;
    hLine.attr('x1',x).attr('x2',x).attr('opacity',0.9);
    const d = priceData.find(p => p.yq === q);
    if (d) hDot.attr('cx',x).attr('cy',ySc(d.corn)).attr('opacity',1);
    document.getElementById('quarter-label').textContent = q.slice(0,4) + ' ' + q.slice(5);
    drawBarChart(q);
  }

  updateSelected(selectedQ);

  g.append('rect').attr('width',w).attr('height',h)
    .attr('fill','none').attr('pointer-events','all')
    .on('mousemove', function(event) {
      const [mx] = d3.pointer(event, this);
      const domain = xSc.domain();
      const idx = Math.round((mx - xSc.range()[0]) / xSc.step());
      updateSelected(domain[Math.max(0, Math.min(domain.length-1, idx))]);
    });

  const leg = document.getElementById('line-legend');
  leg.innerHTML = '';
  [['corn','Corn',2],['poultry','Poultry',1],['soy','Soybeans',1],['pork','Pork',1]].forEach(([k,l,w]) => {

    leg.appendChild(el);

  dr.className = 'legend-item';
  dr.innerHTML = `<div class="legend-box" style="background:#8B4513;opacity:0.3"></div><span>2012 Drought</span>`;
  leg.appendChild(dr);
}

function drawBarChart(q) {
  const wrap = document.querySelector('.bar-chart-wrap');
  const W    = Math.min(wrap.clientWidth - 4, 150);
  const m    = { top:8, right:8, bottom:4, left:40 };
  const w    = W - m.left - m.right;
  const h    = 200;

  const svg = d3.select('#bar-svg').attr('width',W).attr('height',h+m.top+m.bottom);
  svg.selectAll('*').remove();

  const g = svg.append('g').attr('transform',`translate(${m.left},${m.top})`);
  const d = useData[q];
  if (!d) return;

  let y0 = 0;
  const bars = categories.map(cat => {
    const v = d[cat] || 0;
    const b = { cat, y0, y1: y0+v };
    y0 += v;
    return b;
  });

  const ySc = d3.scaleLinear().domain([0,100]).range([h,0]);
  const xSc = d3.scaleBand().domain(['u']).range([0,w]).padding(0.15);

  g.append('g').attr('class','grid')
    .call(d3.axisLeft(ySc).tickSize(-w).tickFormat('').ticks(5))
    .call(g => g.select('.domain').remove());

  g.append('g').attr('class','axis')
    .call(d3.axisLeft(ySc).ticks(5).tickFormat(d => d+'%'))
    .call(g => g.select('.domain').remove());

  g.selectAll('rect').data(bars).join('rect')
    .attr('x', xSc('u')).attr('width', xSc.bandwidth())
    .attr('y', b => ySc(b.y1)).attr('height', b => Math.max(0, ySc(b.y0)-ySc(b.y1)))
    .attr('fill', b => catColors[b.cat]);

  // Legend
  const leg = document.getElementById('bar-legend');
  leg.innerHTML = '';
  categories.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'legend-item';
    el.innerHTML = `<div class="legend-box" style="background:${catColors[cat]}"></div><span>${catLabels[cat]}</span>`;
    leg.appendChild(el);
  });
}

function init() { drawLineChart(); drawBarChart(selectedQ); }
window.addEventListener('resize', init);
init();
</script>
</body>
</html>
